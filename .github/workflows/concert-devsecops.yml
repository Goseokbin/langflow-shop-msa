name: Langflow shop DevSecOps
on:
  push:
    branches: [main]
    paths: ['services/**', 'scripts/**', 'openshift/**', '.github/actions/**', '.github/codeql/**', '.github/workflows/concert-devsecops.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: langflow-shop-devsecops
  cancel-in-progress: false
env:
  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
  OPENSHIFT_CA: ${{ secrets.OPENSHIFT_CA }}
  CONCERT_AUTH_HEADER: ${{ secrets.CONCERT_AUTH_HEADER }}
  PIPELINE_STATE_KEY: ${{ secrets.PIPELINE_STATE_KEY }}
jobs:
  prepare:
    name: 01 · 준비
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: prepare
  source_scan:
    name: 02 · 소스 Trivy 스캔
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: source-scan
          previous: prepare
  sast_scan:
    name: 03 · CodeQL SAST 분석
    needs: source_scan
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: sast-scan
          previous: source-scan
  sast_ingest:
    name: 04 · Concert SAST 업로드 · 검증
    needs: sast_scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: sast-ingest
          previous: sast-scan
  build:
    name: 05 · 이미지 빌드 · Push
    needs: sast_ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: build
          previous: sast-ingest
  image_scan:
    name: 06 · 이미지 Trivy 스캔
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: image-scan
          previous: build
  concert_ingest:
    name: 07 · Concert CVE 업로드
    needs: image_scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: concert-ingest
          previous: image-scan
  deploy:
    name: 08 · OpenShift 배포
    needs: concert_ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: deploy
          previous: concert-ingest
  link_verify:
    name: 09 · Concert 연결 검증
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: link-verify
          previous: deploy
  smoke:
    name: 10 · 쇼핑몰 기능 검증
    needs: link_verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: smoke
          previous: link-verify
