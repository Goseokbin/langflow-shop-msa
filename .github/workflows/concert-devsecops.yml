name: Langflow shop DevSecOps
on:
  push:
    branches: [main]
    paths: ['services/**', 'scripts/**', 'openshift/**', '.github/actions/**', '.github/codeql/**', '.github/workflows/concert-devsecops.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: langflow-shop-devsecops
  cancel-in-progress: false
env:
  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
  OPENSHIFT_CA: ${{ secrets.OPENSHIFT_CA }}
  CONCERT_AUTH_HEADER: ${{ secrets.CONCERT_AUTH_HEADER }}
  PIPELINE_STATE_KEY: ${{ secrets.PIPELINE_STATE_KEY }}
  PROMOTION_STATE_KEY: ${{ secrets.PROMOTION_STATE_KEY }}
jobs:
  prepare:
    name: 01 · 준비
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: prepare
  source_scan:
    name: 02 · 소스 Trivy 스캔
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: source-scan
          previous: prepare
  sast_scan:
    name: 03 · CodeQL SAST 분석
    needs: source_scan
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: sast-scan
          previous: source-scan
  sast_ingest:
    name: 04 · Concert SAST 업로드 · 검증
    needs: sast_scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: sast-ingest
          previous: sast-scan
  build:
    name: 05 · 이미지 빌드 · Push
    needs: sast_ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: build
          previous: sast-ingest
  image_scan:
    name: 06 · 이미지 Trivy 스캔
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: image-scan
          previous: build
  concert_ingest:
    name: 07 · Concert CVE 업로드
    needs: image_scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: concert-ingest
          previous: image-scan
  deploy:
    name: 08 · 검증 OpenShift 배포
    needs: concert_ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: deploy
          previous: concert-ingest
  link_verify:
    name: 09 · Concert 연결 검증
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/devsecops-stage
        with:
          stage: link-verify
          previous: deploy
  smoke:
    name: 10 · 쇼핑몰 기능 검증
    needs: link_verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_sha256: ${{ steps.smoke.outputs.release_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: smoke
        uses: ./.github/actions/devsecops-stage
        with:
          stage: smoke
          previous: link-verify
  production:
    name: 11 · 운영 배포 — 승인 필요
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: production
    env:
      OPENSHIFT_SERVER: ${{ secrets.PROD_OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.PROD_OPENSHIFT_TOKEN }}
      OPENSHIFT_CA: ${{ secrets.PROD_OPENSHIFT_CA }}
      CONCERT_AUTH_HEADER: ${{ secrets.PROD_CONCERT_AUTH_HEADER }}
      SHOP_NAMESPACE: shopping-mall-prod
      DEPLOYMENT_TIER: production
      RELEASE_SHA256: ${{ needs.smoke.outputs.release_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install OpenShift CLI
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/promotion-tools"
          curl -fsSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/4.19.38/openshift-client-linux.tar.gz -o "$RUNNER_TEMP/oc.tgz"
          tar -xzf "$RUNNER_TEMP/oc.tgz" -C "$RUNNER_TEMP/promotion-tools" oc
          echo "$RUNNER_TEMP/promotion-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: verified-release
          path: .runtime/approved-release
      - name: Authenticate after human approval
        shell: bash
        run: |
          set -eu
          umask 077
          printf '%s' "$OPENSHIFT_CA" > "$RUNNER_TEMP/production-ca.pem"
          oc login --server="$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --certificate-authority="$RUNNER_TEMP/production-ca.pem" >/dev/null
      - name: Promote the exact tested digests · verify commerce · ingest production
        run: python3 scripts/promote-release.py --release .runtime/approved-release/release.enc --expected-sha256 "$RELEASE_SHA256"
      - name: Publish production verification
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: demo-production
          path: .runtime/production/verification.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.kube/config" "$RUNNER_TEMP/production-ca.pem" .runtime/production/authorization
